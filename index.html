<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Double-Slit Experiment</title>
<style>
  :root {
    --bg-color: #08090a;
    --card-bg: #111318;
    --text-primary: #ffffff;
    --text-secondary: #94a3b8;
    --accent-blue: #3b82f6;
    --accent-blue-dark: #1d4ed8;
    --accent-cyan: #60a5fa;
    --border-color: #1e293b;
    --input-bg: #1e293b;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Header Controls */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.5px;
  }

  .top-buttons {
    display: flex;
    gap: 10px;
  }

  .icon-btn {
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .icon-btn:hover {
    background: #2d3748;
  }

  .icon-btn svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  /* Simulation Canvas Container */
  .stage-container {
    position: relative;
    width: 100%;
    height: 320px;
    background-color: var(--bg-color);
    border-radius: 12px;
    overflow: hidden;
  }

  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Status Banner */
  .stats-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;
    margin-top: 10px;
    margin-bottom: 10px;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .stat-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-secondary);
    letter-spacing: 1px;
    margin-bottom: 4px;
    text-transform: uppercase;
  }

  .stat-value {
    font-size: 15px;
    font-weight: 700;
    color: #f1f5f9;
  }

  .stat-divider {
    width: 1px;
    height: 24px;
    background-color: var(--border-color);
  }

  /* Controls Form */
  .controls {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .control-label {
    font-size: 13px;
    color: #e2e8f0;
    width: 140px;
    flex-shrink: 0;
  }

  .slider-container {
    flex-grow: 1;
    display: flex;
    align-items: center;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: #334155;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ffffff;
    cursor: pointer;
    transition: transform 0.1s;
  }

  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }

  .value-display {
    width: 60px;
    height: 32px;
    background: var(--input-bg);
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 12px;
    color: var(--text-primary);
    margin-left: 12px;
  }

  /* Toggle Slit Mode Selector */
  .segmented-control {
    display: flex;
    background: var(--input-bg);
    border-radius: 20px;
    padding: 3px;
    width: 100%;
  }

  .segmented-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    padding: 10px 0;
    border-radius: 18px;
    font-size: 13px;
    font-weight: 600;
    font-family: monospace;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .segmented-btn.active {
    background: #1e3a8a;
    color: #ffffff;
    border: 1px solid #3b82f6;
  }

  /* Toggle Switch */
  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
  }

  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .slider-toggle {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: var(--input-bg);
    transition: .3s;
    border-radius: 24px;
    border: 1px solid var(--border-color);
  }

  .slider-toggle:before {
    position: absolute;
    content: "";
    height: 16px;
    width: 16px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .3s;
    border-radius: 50%;
  }

  input:checked + .slider-toggle {
    background-color: var(--accent-blue);
  }

  input:checked + .slider-toggle:before {
    transform: translateX(20px);
  }

  /* Bottom Arrow */
  .footer-icon {
    display: flex;
    justify-content: center;
    margin-top: 10px;
  }

  .scroll-down {
    background: var(--input-bg);
    border: none;
    color: var(--text-secondary);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>Double-Slit Experiment</h1>
    <div class="top-buttons">
      <button class="icon-btn" id="playBtn" title="Play/Pause">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="icon-btn" id="resetBtn" title="Reset">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
  </div>

  <!-- Main Canvas -->
  <div class="stage-container">
    <canvas id="simCanvas" width="680" height="320"></canvas>
  </div>

  <!-- Stats Display -->
  <div class="stats-bar">
    <div class="stat-item">
      <span class="stat-label">Particles</span>
      <span class="stat-value" id="particleCount">0</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <span class="stat-label">Status</span>
      <span class="stat-value" id="simStatus">Running</span>
    </div>
  </div>

  <!-- Controls Panel -->
  <div class="controls">
    <div class="control-row">
      <span class="control-label">Slit Separation</span>
      <div class="slider-container">
        <input type="range" id="separation" min="10" max="50" value="28">
      </div>
      <div class="value-display" id="sepVal">28</div>
    </div>

    <div class="control-row">
      <span class="control-label">Wavelength</span>
      <div class="slider-container">
        <input type="range" id="wavelength" min="10" max="40" value="20">
      </div>
      <div class="value-display" id="wavVal">20</div>
    </div>

    <div class="control-row">
      <span class="control-label">Emission Rate</span>
      <div class="slider-container">
        <input type="range" id="rate" min="1" max="100" value="40">
      </div>
      <div class="value-display" id="rateVal">40</div>
    </div>

    <div class="control-row">
      <span class="control-label">Mode</span>
      <div class="segmented-control">
        <button class="segmented-btn" id="oneSlitBtn">One Slit</button>
        <button class="segmented-btn active" id="twoSlitsBtn">Two Slits</button>
      </div>
    </div>

    <div class="control-row switch-row">
      <span class="control-label">Show Intensity Curve</span>
      <label class="switch">
        <input type="checkbox" id="curveToggle">
        <span class="slider-toggle"></span>
      </label>
    </div>
  </div>

  <div class="footer-icon">
    <button class="scroll-down">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
    </button>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');
  
  // HUD Elements
  const countDisplay = document.getElementById('particleCount');
  const statusDisplay = document.getElementById('simStatus');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const resetBtn = document.getElementById('resetBtn');
  
  // Controls
  const sepInput = document.getElementById('separation');
  const wavInput = document.getElementById('wavelength');
  const rateInput = document.getElementById('rate');
  const sepVal = document.getElementById('sepVal');
  const wavVal = document.getElementById('wavVal');
  const rateVal = document.getElementById('rateVal');
  const oneSlitBtn = document.getElementById('oneSlitBtn');
  const twoSlitsBtn = document.getElementById('twoSlitsBtn');
  const curveToggle = document.getElementById('curveToggle');

  // App State
  let state = {
    isRunning: true,
    twoSlits: true,
    showCurve: false,
    separation: 28,
    wavelength: 20,
    rate: 40,
    count: 0
  };

  let particles = [];
  let screenHits = []; // Accumulated points on the right screen
  
  const W = canvas.width;
  const H = canvas.height;
  
  // Layout X positions
  const sourceX = 120;
  const barrierX = 280;
  const screenX = 460;

  // Quantum probability intensity profile
  function intensity(y) {
    const cy = y - H / 2;
    const d = state.separation;
    const lambda = state.wavelength;
    const a = d / 4; 

    const fringeSpacing = lambda * 6;
    const envelopeWidth = lambda * 6 * (d / a);

    const beta = (Math.PI * cy) / fringeSpacing;
    const alpha = (Math.PI * cy) / envelopeWidth;

    const sinc = alpha === 0 ? 1 : Math.sin(alpha) / alpha;
    const envelope = sinc * sinc;

    if (!state.twoSlits) return envelope;
    
    const interference = Math.cos(beta) * Math.cos(beta);
    return envelope * interference;
  }

  function getMaxIntensity() {
    let max = 0;
    for (let y = 20; y < H - 20; y += 2) {
      const val = intensity(y);
      if (val > max) max = val;
    }
    return max || 1;
  }

  let maxI = getMaxIntensity();

  function sampleY() {
    for (let i = 0; i < 200; i++) {
      const y = 30 + Math.random() * (H - 60);
      const prob = intensity(y) / maxI;
      if (Math.random() < prob) return y;
    }
    return H / 2;
  }

  // Particle emission logic
  let acc = 0;
  let lastTime = performance.now();

  function emitParticle() {
    const targetY = sampleY();
    
    // Determine slit alignment path visually
    let slitY = H / 2;
    if (state.twoSlits) {
      slitY += (Math.random() < 0.5 ? -1 : 1) * (state.separation / 2);
    }

    particles.push({
      x: sourceX,
      y: H / 2,
      targetY: targetY,
      slitY: slitY,
      progress: 0,
      speed: 0.015 + Math.random() * 0.005
    });
  }

  // Main Draw Loop
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 1. Draw Diagrams / Labels
    drawLabels();
    drawSource();
    drawBarrier();
    drawScreen();

    // 2. Draw Intensity Curve Overlay
    if (state.showCurve) {
      drawCurve();
    }

    // 3. Draw Hits on Detector Screen
    ctx.fillStyle = '#60a5fa';
    for (let hit of screenHits) {
      ctx.fillRect(hit.x, hit.y, 2, 2);
    }

    // 4. Move and Draw In-Flight Particles
    if (state.isRunning) {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.progress += p.speed;

        // Path interpolation: Source -> Slit -> Screen
        if (p.progress < 0.5) {
          const t = p.progress * 2;
          p.x = sourceX + t * (barrierX - sourceX);
          p.y = H / 2 + t * (p.slitY - H / 2);
        } else {
          const t = (p.progress - 0.5) * 2;
          p.x = barrierX + t * (screenX - barrierX);
          p.y = p.slitY + t * (p.targetY - p.slitY);
        }

        // Render traveling particle dot
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = '#60a5fa';
        ctx.fill();

        // Hit Detector Screen
        if (p.progress >= 1) {
          screenHits.push({ x: screenX + (Math.random() - 0.5) * 3, y: p.targetY });
          state.count++;
          countDisplay.textContent = state.count;
          particles.splice(i, 1);
        }
      }
    }
  }

  function drawLabels() {
    ctx.font = '11px -apple-system, sans-serif';
    ctx.textAlign = 'center';

    // Source Label
    drawPillLabel(sourceX, 75, 'Source');
    
    // Slits Label
    drawPillLabel(barrierX, 40, state.twoSlits ? 'Two Slits' : 'One Slit');

    // Detector Label
    drawPillLabel(screenX, 40, 'Detector Screen');
  }

  function drawPillLabel(x, y, text) {
    ctx.font = '11px sans-serif';
    const textWidth = ctx.measureText(text).width;
    const padding = 10;
    const h = 20;
    const w = textWidth + padding * 2;

    ctx.fillStyle = '#1e293b';
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1;

    // Rounded rectangle
    ctx.beginPath();
    ctx.roundRect(x - w / 2, y - h / 2, w, h, 10);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);

    // Indicator line down to element
    ctx.beginPath();
    ctx.strokeStyle = '#475569';
    ctx.moveTo(x, y + h / 2);
    ctx.lineTo(x, y + h / 2 + 8);
    ctx.stroke();
  }

  function drawSource() {
    ctx.beginPath();
    ctx.arc(sourceX, H / 2, 10, 0, Math.PI * 2);
    ctx.fillStyle = '#60a5fa';
    ctx.fill();
  }

  function drawBarrier() {
    ctx.fillStyle = '#94a3b8';
    const slitWidth = 4;
    const gap = state.separation;

    if (state.twoSlits) {
      // Top section
      ctx.fillRect(barrierX - 1, 60, 3, H / 2 - gap / 2 - 60);
      // Middle section
      ctx.fillRect(barrierX - 1, H / 2 - gap / 2 + slitWidth, 3, gap - slitWidth);
      // Bottom section
      ctx.fillRect(barrierX - 1, H / 2 + gap / 2 + slitWidth, 3, H - 60 - (H / 2 + gap / 2 + slitWidth));
    } else {
      // Single slit barrier
      ctx.fillRect(barrierX - 1, 60, 3, H / 2 - slitWidth - 60);
      ctx.fillRect(barrierX - 1, H / 2 + slitWidth, 3, H - 60 - (H / 2 + slitWidth));
    }
  }

  function drawScreen() {
    ctx.fillStyle = '#334155';
    ctx.fillRect(screenX, 50, 2, H - 100);
  }

  function drawCurve() {
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(96, 165, 250, 0.8)';
    ctx.lineWidth = 1.5;

    for (let y = 50; y < H - 50; y++) {
      const prob = intensity(y) / maxI;
      const x = screenX + prob * 80;
      if (y === 50) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  function animate(now) {
    const dt = (now - lastTime) / 1000;
    lastTime = now;

    if (state.isRunning) {
      acc += dt * state.rate;
      const toEmit = Math.floor(acc);
      acc -= toEmit;

      for (let i = 0; i < toEmit; i++) {
        emitParticle();
      }
    }

    draw();
    requestAnimationFrame(animate);
  }

  function resetSimulation() {
    particles = [];
    screenHits = [];
    state.count = 0;
    countDisplay.textContent = '0';
    maxI = getMaxIntensity();
  }

  // --- Event Listeners ---
  playBtn.addEventListener('click', () => {
    state.isRunning = !state.isRunning;
    simStatus.textContent = state.isRunning ? 'Running' : 'Paused';
    playIcon.innerHTML = state.isRunning 
      ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' 
      : '<path d="M8 5v14l11-7z"/>';
  });

  resetBtn.addEventListener('click', resetSimulation);

  sepInput.addEventListener('input', (e) => {
    state.separation = parseFloat(e.target.value);
    sepVal.textContent = state.separation;
    resetSimulation();
  });

  wavInput.addEventListener('input', (e) => {
    state.wavelength = parseFloat(e.target.value);
    wavVal.textContent = state.wavelength;
    resetSimulation();
  });

  rateInput.addEventListener('input', (e) => {
    state.rate = parseFloat(e.target.value);
    rateVal.textContent = state.rate;
  });

  oneSlitBtn.addEventListener('click', () => {
    state.twoSlits = false;
    oneSlitBtn.classList.add('active');
    twoSlitsBtn.classList.remove('active');
    resetSimulation();
  });

  twoSlitsBtn.addEventListener('click', () => {
    state.twoSlits = true;
    twoSlitsBtn.classList.add('active');
    oneSlitBtn.classList.remove('active');
    resetSimulation();
  });

  curveToggle.addEventListener('change', (e) => {
    state.showCurve = e.target.checked;
  });

  // Start Loop
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
